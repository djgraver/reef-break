<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Reef Wave 3D</title>
<style>
  :root { --ink:#eaf4f6; --dim:rgba(234,244,246,.62); --glass:rgba(8,22,30,.52); --line:rgba(234,244,246,.16); --hot:#7fe3d0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0a1a24; color:var(--ink); overflow:hidden;
    font:13px/1.35 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  canvas#gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .hud { position:fixed; left:12px; top:12px; pointer-events:none; background:var(--glass); border:1px solid var(--line); border-radius:12px; padding:8px 11px; max-width:calc(100vw - 120px); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  .hud h1 { margin:0; font-size:15px; font-weight:650; letter-spacing:.02em; }
  .hud p { margin:2px 0 0; color:var(--dim); font-size:12px; font-variant-numeric:tabular-nums; }
  .bar { position:fixed; left:0; right:0; bottom:0; padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));
    display:flex; gap:6px; justify-content:center; flex-wrap:wrap; pointer-events:none; }
  button { font:inherit; color:var(--ink); background:var(--glass); border:1px solid var(--line); border-radius:999px;
    padding:8px 13px; pointer-events:auto; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); cursor:pointer; }
  button.on { border-color:var(--hot); color:var(--hot); }
  button:focus-visible { outline:2px solid var(--hot); outline-offset:2px; }
  #gear { position:fixed; right:12px; top:12px; }
  #panel { position:fixed; right:12px; top:54px; width:min(280px,calc(100vw - 24px)); background:var(--glass); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); display:none; }
  #panel.open { display:block; }
  #panel label { display:flex; justify-content:space-between; color:var(--dim); margin-top:10px; font-size:12px; }
  #panel label b { color:var(--ink); font-weight:550; font-variant-numeric:tabular-nums; }
  #panel input[type=range] { width:100%; accent-color:var(--hot); margin:4px 0 0; }
  .seg { display:flex; gap:6px; margin-top:6px; }
  .seg button { flex:1; padding:7px 6px; border-radius:10px; }
  #note { margin:12px 0 0; color:var(--dim); font-size:11.5px; }
  #sec { position:fixed; left:12px; bottom:calc(62px + env(safe-area-inset-bottom,0px)); width:min(300px,62vw); height:110px;
    background:var(--glass); border:1px solid var(--line); border-radius:12px; display:none; }
  #sec.open { display:block; }
  #load { position:fixed; inset:0; display:grid; place-items:center; background:#0a1a24; color:var(--dim); transition:opacity .5s; }
  #load.done { opacity:0; pointer-events:none; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="hud"><h1 id="ttl">Reef Wave</h1><p id="st1"></p><p id="st2"></p></div>
<button id="gear" aria-label="Settings">Settings</button>
<div id="panel">
  <div style="color:var(--dim);font-size:12px">Break</div>
  <div class="seg" id="segBreak"><button data-b="teahupoo" class="on">Teahupo'o</button><button data-b="cloudbreak">Cloudbreak</button></div>
  <label>Wave face <b id="vSize"></b></label><input id="rSize" type="range" min="0.45" max="3.4" step="0.05" value="1.25">
  <label>Peel speed <b id="vPeel"></b></label><input id="rPeel" type="range" min="6" max="30" step="0.5" value="12">
  <label>Playback <b id="vSpd"></b></label><input id="rSpd" type="range" min="0" max="1.5" step="0.05" value="1">
  <div class="seg"><button id="bFollow" class="on">Follow the peel</button><button id="bFixed">Fixed on reef</button></div>
  <div class="seg"><button id="bSec">Cross-section</button><button id="bSpray" class="on">Spray</button><button id="bReplay">Replay</button></div>
  <p id="note">Water surface up to the moment the lip lands is solver output: inviscid free-surface flow over the reef, stepped in time. Whitewater after the lip lands is modelled, not solved.</p>
</div>
<canvas id="sec"></canvas>
<div class="bar" id="cams">
  <button data-c="channel" class="on">Channel</button><button data-c="beach">Beach</button><button data-c="aerial">Aerial</button><button data-c="tube">Tube</button><button data-c="line">Lineup</button>
</div>
<div id="load">Building the wave…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="data_teahupoo.js"></script>
<script>
"use strict";
(function(){
const $ = id => document.getElementById(id);
const canvas = $('gl');
if(!window.THREE || !window.WAVE_DATA){ $('load').textContent = 'Could not load the 3D library or wave data. Check the connection and reload.'; return; }
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
catch(e){ $('load').textContent = 'This device could not start WebGL.'; return; }
const DPR = Math.min(window.devicePixelRatio||1, 2);
renderer.setPixelRatio(DPR);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.15, 20000);

/* ---------- shared GLSL ---------- */
const NOISE = `
float hash21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
vec2 hash22(vec2 p){ float n=hash21(p); return vec2(n, hash21(p+n+17.3)); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash21(i),hash21(i+vec2(1,0)),f.x), mix(hash21(i+vec2(0,1)),hash21(i+vec2(1,1)),f.x), f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,3.7); a*=.5; } return s; }
float fbm2(vec2 p){ return .62*vnoise(p)+.38*vnoise(p*2.17+vec2(5.2,1.3)); }
float worley(vec2 p){ vec2 i=floor(p), f=fract(p); float d=1.;
  for(int y=-1;y<=1;y++) for(int x=-1;x<=1;x++){ vec2 g=vec2(float(x),float(y)); vec2 o=hash22(i+g); d=min(d, length(g+o-f)); }
  return d; }
`;
const SKY = `
uniform vec3 uSun;
vec3 skyBase(vec3 d){
  float h=max(d.y,0.);
  vec3 c=mix(vec3(.60,.78,.93), vec3(.075,.27,.66), pow(h,.42));
  float sd=max(dot(d,uSun),0.);
  c+=vec3(1.,.86,.62)*(pow(sd,6.)*.22+pow(sd,60.)*.35);
  return c;
}
`;
const LAND = `
vec2 landParts(vec2 p){
  float n=fbm(p*.07)*2.-1.; float n2=fbm(p*.45+3.);
  vec2 q=(p-vec2(6.,36.))/vec2(42.,30.); float r=1.-dot(q,q)+n*.22;
  float reef=mix(r*3.2, .30+.42*n2+.18*fbm(p*1.7), smoothstep(-.04,.22,r));
  float b=(.055*(p.x-40.)+.05*(p.y-56.)+.5*n)/2.4;
  float beach=3.4*b/sqrt(1.+b*b);
  return vec2(reef,beach);
}
float land(vec2 p){ vec2 l=landParts(p); return max(l.x,l.y); }
`;
const SECT = `
uniform float uPeel, uZend, uWild;
float h31(vec3 p){ p=fract(p*.3183099+.1); p*=17.; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
float n3(vec3 p){ vec3 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),f.x), mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),f.x), f.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),f.x), mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),f.x), f.y), f.z); }
// sections: the reef makes the lip throw a little early in some places and late in others
float sec1(float z){ return (n3(vec3(z/19.,3.7,1.3))*2.-1.) + .45*(n3(vec3(z/7.,9.1,4.2))*2.-1.); }
float secAmp(){ return .05+.16*uWild; }
// where along the reef the wave exists: starts at the exposed reef (z=0), dies into the channel past uZend
float env(float z){ return (1.-smoothstep(-6.,5.,z))*smoothstep(uZend-36.,uZend-4.,z); }
`;
const TONE = `
vec3 tone(vec3 x){ x*=1.02; x=(x*(2.51*x+.03))/(x*(2.43*x+.59)+.14); return pow(clamp(x,0.,1.), vec3(1./2.2)); }
`;

/* ---------- sky dome ---------- */
const uni = {
  uSun:{value:new THREE.Vector3(0,1,0)}, uTime:{value:0}, uV:{value:12}, uScale:{value:1.25}, uPeel:{value:0}, uZend:{value:-100}, uWild:{value:0}, uXtd:{value:290}, uYtr:{value:-.5}, uCw:{value:7}, uFake:{value:1},
  uTb:{value:0}, uPx:{value:800}, uSpray:{value:1}
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 48, 24), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, depthTest:false, uniforms:{uSun:uni.uSun, uTime:uni.uTime},
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`precision highp float; varying vec3 vD; uniform float uTime; ${NOISE} ${SKY} ${TONE}
  void main(){ vec3 d=normalize(vD); vec3 c=skyBase(d);
    float sd=max(dot(d,uSun),0.); c+=vec3(1.,.95,.85)*smoothstep(.9994,.9998,sd)*6.;
    if(d.y>0.){ vec2 q=d.xz/(d.y+.12)*1.4+vec2(uTime*.004,0.);
      float cl=smoothstep(.52,.80,fbm(q)+.18*fbm(q*3.1)); cl*=smoothstep(0.,.10,d.y)*(1.-smoothstep(.45,.9,d.y));
      vec3 cc=mix(vec3(.80,.86,.93), vec3(1.), smoothstep(.0,.6,fbm(q*2.+3.))); c=mix(c,cc,cl*.85); }
    else c=mix(vec3(.60,.78,.93), vec3(.03,.16,.30), smoothstep(0.,-.25,d.y));
    gl_FragColor=vec4(tone(c),1.); }`
}));
sky.renderOrder = -10; sky.frustumCulled = false; scene.add(sky);

/* ---------- water ---------- */
const WATER_VS = `
attribute vec2 aP; attribute vec2 aT; attribute vec2 aVel; attribute vec2 aSky; attribute vec3 aLight; attribute vec2 aFoam;
attribute vec3 aMisc; // tau - tb, label, stretch
attribute float aDep; attribute float aSec;
uniform float uV, uScale, uTime, uYtr;
varying vec3 vPos, vN, vT1, vLight; varying vec2 vTex, vSky, vFoam, vWxz; varying float vS, vDep, vA;
${SECT}
void main(){
  float tr = aMisc.x;
  float z0 = uV*tr + uPeel;
  float s0 = sec1(z0), s1 = sec1(z0+1.);
  float w = aSec*smoothstep(-2.6,-.9,tr);
  float z = z0 - uV*secAmp()*s0*w;
  float E = smoothstep(-9.,-7.2,tr)*(1.-smoothstep(3.6,5.,tr));
  float A = env(z0)*E;
  vec2 rest = vec2(aMisc.y, 0.);
  vec2 d = aP - rest;
  float hv = 1. + (.03+.12*uWild)*(n3(vec3(z0/23.,1.1,7.7))*2.-1.)*smoothstep(-5.,-1.5,tr);
  if(d.y>uYtr) d.y = uYtr + (d.y-uYtr)*hv;
  vec3 T1 = vec3(aT, 0.);
  vec3 T2 = vec3(aVel/uV, 1. - uV*secAmp()*(s1-s0)*w);
  vec3 N = normalize(cross(T2, T1));
  N = normalize(mix(vec3(0.,1.,0.), N, A));
  vec3 p = vec3(rest + A*d, z);
  vec3 m = p*uScale;
  float turb = aFoam.y*smoothstep(0.,.3,A)*(1.+.8*uWild);
  if(turb>0.003){
    float b = n3(vec3(m.x*.55, m.z*.55, uTime*1.1+m.y*.4))*.65 + n3(vec3(m.x*1.4, m.z*1.4, uTime*1.9))*.35;
    p += (N*.55+vec3(0.,.45,0.)) * turb*(b-.30)*1.9;
  }
  vPos = p*uScale; vN = N; vT1 = T1; vA = A;
  vTex = vec2(aMisc.y, z)*uScale; vWxz = m.xz; vS = aMisc.z; vSky = mix(vec2(0.,3.14159), aSky, A); vLight = mix(vec3(30.,0.,1.), aLight, A);
  vFoam = vec2(aFoam.x*smoothstep(0.,.25,A), turb); vDep = aDep*uScale;
  gl_Position = projectionMatrix*viewMatrix*vec4(vPos,1.);
}`;
const WATER_FS = `
precision highp float;
uniform float uTime, uScale, uV, uPeel, uXtd, uCw, uFake, uWild;
varying vec3 vPos, vN, vT1, vLight; varying vec2 vTex, vSky, vFoam, vWxz; varying float vS, vDep, vA;
${NOISE} ${SKY} ${TONE} ${LAND}
float chop(vec2 p, float t){ return fbm2(p*vec2(.9,.9)+vec2(t*.25,t*.1)) + .5*fbm2(p*2.7-vec2(t*.2,t*.33)); }
void main(){
  vec3 Vd = cameraPosition - vPos; float dist = length(Vd); Vd /= dist;
  vec3 N = normalize(vN); if(dot(N,Vd)<-.05) N=-N;
  vec2 pb = vPos.xz/uScale;
  // exposed reef and beach: shallow water and a wash line around them
  float dep = vDep; float shore = 0.;
  vec2 lp = vec2(pb.x-uXtd, pb.y);
  if(lp.y>-30. && lp.x>-90. && lp.y<320. && lp.x<260.){
    float dl = -land(lp);
    dep = mix(min(dep, max(dl,.03)*uScale), dep, smoothstep(.7,1.7,dl));
    float lap = .07*sin(uTime*1.3+lp.x*.25+lp.y*.31)+.05*fbm2(lp*.8+uTime*.3);
    shore = (1.-smoothstep(.02,.34,dl+lap))*smoothstep(-.35,-.05,dl)*.95;
  }
  vec3 Tm = normalize(vT1 - N*dot(vT1,N)); vec3 Bm = cross(N,Tm);
  // small surface texture carried by the water itself (stretches up the face and into the lip)
  float e = .12; float lod = exp(-dist/55.)*smoothstep(.02,.30,abs(dot(N,Vd)));
  float h0 = chop(vTex,uTime), hx = chop(vTex+vec2(e,0.),uTime), hz = chop(vTex+vec2(0.,e),uTime);
  vec2 gr = vec2(hx-h0, hz-h0)/e; gr.x /= max(vS,.25);
  float g0=fbm2(vTex*.22+uTime*.06); vec2 gf = vec2(fbm2(vTex*.22+vec2(e,0.)+uTime*.06)-g0, fbm2(vTex*.22+vec2(0.,e)+uTime*.06)-g0)/e;
  vec3 Nw = normalize(N - (Tm*gr.x + Bm*gr.y)*(.060*lod*(1.+1.3*uWild)) - (Tm*gf.x+Bm*gf.y)*.045*exp(-dist/140.));
  if(dot(Nw,Vd)<0.) Nw = reflect(Nw, Vd);
  float nv = clamp(dot(Nw,Vd),0.,1.);
  float F = .02 + .98*pow(1.-nv,5.);
  vec3 R = reflect(-Vd,Nw);
  float shadow = vLight.y;
  // which part of the sky this point can see (computed in the wave's cross-section)
  float ang = atan(max(R.y,-.2), R.x);
  float vis = smoothstep(vSky.x-.14, vSky.x+.10, ang) * (1.-smoothstep(vSky.y-.10, vSky.y+.14, ang));
  float open = clamp((vSky.y-vSky.x)/3.14159,0.,1.);
  vis = mix(vis, 1., smoothstep(2.7,3.05,vSky.y-vSky.x));
  vec3 sunC = vec3(1.,.95,.86)*2.6; vec3 amb = vec3(.36,.50,.70)*(.35+.65*open);
  // light through the water
  vec3 ab = vec3(.38,.055,.030);
  float cosr = max(-refract(-Vd,Nw,.75).y,.22);
  vec3 rf = refract(-Vd,Nw,.75);
  float path = dep/cosr;
  vec2 bxz = vWxz + rf.xz*path;
  float c1 = fbm(bxz*.11), c2 = fbm(bxz*.55+7.);
  float coral = smoothstep(.34,.70,c1*.70+c2*.30);
  vec3 reef = mix(vec3(.66,.62,.47), vec3(.24,.22,.14), coral)*(.82+.36*c2);
  float ca = 1.-abs(2.*vnoise(bxz*2.3+vec2(uTime*.5,uTime*.3))-1.); float cb = 1.-abs(2.*vnoise(bxz*3.1-vec2(uTime*.4,uTime*.55)+9.)-1.);
  float caust = pow(ca*cb,2.)*.45*exp(-dep*.22);
  vec3 Tdn = exp(-ab*dep), Tup = exp(-ab*path);
  float streak = fbm2(vec2(vTex.x*.45, vTex.y*3.2)) + .5*fbm2(vec2(vTex.x*1.1, vTex.y*9.));
  float stk = mix(1., .72+.40*streak, exp(-dist/70.));
  float thick = vLight.x*uScale; float thru = 1.-smoothstep(14.,23.5,vLight.x);
  float lit = vLight.z;
  vec3 bottom = reef*(sunC*.20*lit*(1.+caust)+amb*.42)*Tdn*Tup;
  vec3 scatC = vec3(.0012,.017,.037);
  vec3 body = bottom + stk*scatC*(sunC*(.35+.65*lit)+amb)*(1.-exp(-.30*path));
  // sun shining through thin water: the glowing lip
  vec3 glow = vec3(.07,.70,.66)*stk*exp(-vec3(1.2,.30,.40)*thick)*(.55+.45*pow(max(dot(-Vd,uSun),0.),2.));
  body += glow*sunC*.26*thru;
  vec3 skyR = skyBase(normalize(vec3(R.x,max(R.y,.02),R.z)));
  vec3 tubeR = scatC*(sunC+amb)*1.6 + glow*sunC*.16;
  vec3 refl = mix(tubeR, skyR, vis);
  vec3 col = mix(body, refl, F);
  float sd = max(dot(R,uSun),0.);
  col += sunC*(pow(sd,900.)*9. + pow(sd,90.)*.10)*vis*(1.-shadow);
  // foam
  float fo = max(vFoam.x, shore);
  if(fo>.004){
    vec2 fp = vWxz;
    float w1 = worley(fp*.85+vec2(0.,uTime*.05)); float w2 = worley(fp*2.3+4.);
    float pat = clamp(w1*1.25+ w2*.35 + fbm2(fp*4.)*.25 - .18, 0., 1.);
    float th = 1.-fo;
    float cov = smoothstep(th-.10, th+.22, pat*.92+.04) * smoothstep(.05,.30,fo);
    cov = max(cov, smoothstep(.72,.96,fo)); cov = max(cov, smoothstep(.02,.10,vFoam.y)*smoothstep(.2,.5,fo));
    float b0 = fbm(fp*1.3+uTime*.35), bx2 = fbm(fp*1.3+vec2(.15,0.)+uTime*.35), bz2 = fbm(fp*1.3+vec2(0.,.15)+uTime*.35);
    vec3 Nf = normalize(N - (Tm*(bx2-b0)+Bm*(bz2-b0))/.15*(.35+1.6*vFoam.y));
    float wrap = clamp(dot(Nf,uSun)*.62+.38,0.,1.);
    float b1 = fbm(fp*3.1-uTime*.5);
    float crease = mix(.62,1.08, smoothstep(.28,.66,b0*.6+b1*.4));
    vec3 fc = vec3(.93,.95,.96)*(sunC*.36*wrap*(1.-.6*shadow) + amb*1.0)*mix(vec3(.80,.90,1.)*crease, vec3(crease), crease);
    fc = mix(fc, fc*vec3(.80,.93,.96), (1.-cov)*.5);
    col = mix(col, fc, cov);
  }
  // haze toward the horizon
  vec3 hzc = skyBase(normalize(vec3(-Vd.x,.015,-Vd.z)));
  col = mix(col, hzc, 1.-exp(-dist/2600.));
  gl_FragColor = vec4(tone(col),1.);
}`;

function b64buf(s){ const bin=atob(s), n=bin.length, u=new Uint8Array(n); for(let i=0;i<n;i++) u[i]=bin.charCodeAt(i); return u.buffer; }
function decode(d){
  const m=d.meta, n=m.M*m.R, buf=b64buf(d.b64); let o=0;
  const f32=()=>{ const a=new Float32Array(buf,o,n); o+=n*4; return a; };
  const q=(lo,hi)=>{ const u=new Uint16Array(buf,o,n); o+=n*2; const a=new Float32Array(n); const k=(hi-lo)/65535; for(let i=0;i<n;i++) a[i]=lo+u[i]*k; return a; };
  const w={m, PX:f32(), PY:f32()};
  w.TX=q(-1,1); w.TY=q(-1,1); w.VU=q(-m.umax,m.umax); w.VV=q(-m.umax,m.umax);
  const ls=q(Math.log(1e-2),Math.log(m.smax)); w.STR=ls.map(Math.exp);
  w.TH1=q(0,Math.PI); w.TH2=q(0,Math.PI); w.THK=q(0,30); w.SHD=q(0,1); w.LIT=q(0,1); w.FOAM=q(0,1); w.TURB=q(0,2); w.DEP=q(0,16);
  return w;
}

let W=null, waveMesh=null, sprayPts=null, geoHi=null;
function buildWave(w){
  const m=w.m, M=m.M, R=m.R, E=3, MX=M+2*E, RX=R+2*E, n=MX*RX;
  const aP=new Float32Array(n*2), aT=new Float32Array(n*2), aVel=new Float32Array(n*2), aSky=new Float32Array(n*2),
        aLight=new Float32Array(n*3), aFoam=new Float32Array(n*2), aMisc=new Float32Array(n*3), aDep=new Float32Array(n), aSec=new Float32Array(n);
  const extL=[-9000,-900,-90], extR=[90,900,9000], extT0=[-700,-70,-6], extT1=[6,70,700];
  const sm=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };
  const span=m.ctd-m.ctip;
  for(let rr=0;rr<RX;rr++){
    let r=rr-E, dT=0, redge=false;
    if(r<0){ dT=extT0[rr]; r=0; redge=true; } else if(r>=R){ dT=extT1[r-R]; r=R-1; redge=true; }
    const tr=m.tau[r]-m.tb+dT;
    for(let c=0;c<MX;c++){
      const i=rr*MX+c; let sc=c-E, dx=0, edge=redge;
      if(sc<0){ dx=extL[c]; sc=0; edge=true; } else if(sc>=M){ dx=extR[sc-M]; sc=M-1; edge=true; }
      const j=r*M+sc;
      aP[2*i]=edge?m.acol[sc]+dx:w.PX[j]; aP[2*i+1]=edge?0:w.PY[j];
      aT[2*i]=edge?1:w.TX[j]; aT[2*i+1]=edge?0:w.TY[j];
      aVel[2*i]=edge?0:w.VU[j]; aVel[2*i+1]=edge?0:w.VV[j];
      aSky[2*i]=edge?0:w.TH1[j]; aSky[2*i+1]=edge?Math.PI:w.TH2[j];
      aLight[3*i]=edge?30:w.THK[j]; aLight[3*i+1]=edge?0:w.SHD[j]; aLight[3*i+2]=edge?1:w.LIT[j];
      aFoam[2*i]=edge?0:w.FOAM[j]; aFoam[2*i+1]=edge?0:w.TURB[j];
      aMisc[3*i]=tr; aMisc[3*i+1]=m.acol[sc]+dx; aMisc[3*i+2]=edge?1:w.STR[j];
      aDep[i]=(dx<0)?16:w.DEP[j];
      aSec[i]=sm(m.cc-85,m.cc-25,sc)*(1-sm(m.ctip+0.25*span,m.ctip+0.6*span,sc));
    }
  }
  const idx=new Uint32Array((MX-1)*(RX-1)*6); let k=0;
  for(let r=0;r<RX-1;r++) for(let q=0;q<MX-1;q++){
    const a=r*MX+q, b=a+1, c=a+MX, d=c+1;
    idx[k++]=a; idx[k++]=c; idx[k++]=d; idx[k++]=a; idx[k++]=d; idx[k++]=b;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('aP',new THREE.BufferAttribute(aP,2)); g.setAttribute('aT',new THREE.BufferAttribute(aT,2));
  g.setAttribute('aVel',new THREE.BufferAttribute(aVel,2)); g.setAttribute('aSky',new THREE.BufferAttribute(aSky,2));
  g.setAttribute('aLight',new THREE.BufferAttribute(aLight,3)); g.setAttribute('aFoam',new THREE.BufferAttribute(aFoam,2));
  g.setAttribute('aMisc',new THREE.BufferAttribute(aMisc,3)); g.setAttribute('aDep',new THREE.BufferAttribute(aDep,1));
  g.setAttribute('aSec',new THREE.BufferAttribute(aSec,1));
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(n*3),3));
  g.setIndex(new THREE.BufferAttribute(idx,1));
  return g;
}

/* ---------- exposed reef and beach at the take-off ---------- */
const landMesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1,170,170), new THREE.ShaderMaterial({
  uniforms:{uSun:uni.uSun, uScale:uni.uScale, uXtd:uni.uXtd},
  vertexShader:`uniform float uScale, uXtd; varying vec2 vLp; varying vec3 vW; ${NOISE} ${LAND}
    void main(){ vLp = vec2(-90.+(uv.x)*350., -30.+(uv.y)*350.); float h=land(vLp);
      vW = vec3(vLp.x+uXtd, h, vLp.y)*uScale; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader:`precision highp float; uniform float uScale; varying vec2 vLp; varying vec3 vW; ${NOISE} ${SKY} ${TONE} ${LAND}
    void main(){ vec2 l=landParts(vLp); float h=max(l.x,l.y); if(h<-.6) discard;
      float e=.25; float hx=land(vLp+vec2(e,0.)), hz=land(vLp+vec2(0.,e));
      vec3 n=normalize(vec3(-(hx-h)/e,1.,-(hz-h)/e));
      float f1=fbm(vLp*1.3), f2=fbm(vLp*4.+5.);
      float f3=fbm(vLp*9.);
      vec3 rock=mix(vec3(.085,.075,.06), vec3(.30,.26,.19), smoothstep(.25,.75,f1*.45+f2*.3+f3*.25));
      rock=mix(rock, vec3(.20,.24,.13), smoothstep(.55,.8,f2)*.5);
      vec3 sand=vec3(.80,.72,.55)*(.88+.22*f2);
      vec3 veg=mix(vec3(.06,.17,.05), vec3(.17,.34,.10), f1)*(.7+.5*f2);
      vec3 c = l.y>l.x ? mix(sand, veg, smoothstep(1.9,2.5,h+f1*.9)) : rock;
      c *= mix(.50,1.,smoothstep(.0,.30,h));
      vec3 sunC=vec3(1.,.95,.86)*2.6, amb=vec3(.36,.50,.70);
      c *= sunC*.30*max(dot(n,uSun),0.) + amb*.85;
      float dist=length(cameraPosition-vW); vec3 Vd=(cameraPosition-vW)/dist;
      c = mix(c, skyBase(normalize(vec3(-Vd.x,.015,-Vd.z))), 1.-exp(-dist/2600.));

landMesh.material.side=THREE.DoubleSide; landMesh.frustumCulled=false; scene.add(landMesh);

/* ---------- a swell line further out to sea: one simple ribbon, not a second wave ---------- */
const swell = new THREE.Mesh(new THREE.PlaneGeometry(1,1,160,32), new THREE.ShaderMaterial({
  side:THREE.DoubleSide, uniforms:uni,
  vertexShader:`uniform float uScale,uXtd,uCw,uV,uPeel,uFake; varying vec3 vW; varying vec3 vN;
    void main(){ float z=(uv.x-.5)*3600.; float ph=(uv.y-.5)*240.;
      float x=uXtd-230.+(uCw/uV)*(z-uPeel)+ph;
      float f=uFake*(1.-smoothstep(uXtd-210.,uXtd-110.,x))*(1.-smoothstep(1200.,1750.,abs(z)));
      float g=exp(-ph*ph/900.); float y=1.5*f*g-.04;
      vN=normalize(vec3(1.5*f*g*2.*ph/900.,1.,0.));
      vW=vec3(x,y,z)*uScale; gl_Position=projectionMatrix*viewMatrix*vec4(vW,1.); }`,
  fragmentShader:`precision highp float; varying vec3 vW; varying vec3 vN; ${SKY} ${TONE}
    void main(){ float dist=length(cameraPosition-vW); vec3 Vd=(cameraPosition-vW)/dist; vec3 N=normalize(vN);
      float nv=clamp(dot(N,Vd),0.,1.); float F=.02+.98*pow(1.-nv,5.);
      vec3 R=reflect(-Vd,N); vec3 skyR=skyBase(normalize(vec3(R.x,max(R.y,.02),R.z)));
      vec3 sunC=vec3(1.,.95,.86)*2.6, amb=vec3(.36,.50,.70);
      vec3 body=vec3(.0012,.017,.037)*(sunC+amb);
      vec3 c=mix(body,skyR,F);
      c=mix(c, skyBase(normalize(vec3(-Vd.x,.015,-Vd.z))), 1.-exp(-dist/2600.));
      gl_FragColor=vec4(tone(c),1.); }`
}));
swell.frustumCulled=false; scene.add(swell);

/* ---------- spray ---------- */
const SPRAY_VS = `
attribute vec3 aP0; attribute vec3 aV0; attribute vec4 aPar; attribute float aAl;
uniform float uTime, uV, uScale, uPx;
varying float vA; varying float vY;
${SECT}
void main(){
  float life=aPar.x; float t=mod(uTime+aPar.y*life, life); float k=aPar.w; float e=(1.-exp(-k*t))/k;
  vec3 p; p.x=aP0.x+aV0.x*e; p.y=aP0.y+aV0.y*e-9.81*(t-e)/k; p.z=uV*aP0.z+uV*t+aV0.z*e+uPeel; float A=env(p.z); p.z-=uV*secAmp()*sec1(p.z)*smoothstep(-2.6,-.9,aP0.z);
  vec4 mv=viewMatrix*vec4(p*uScale,1.);
  float u=t/life;
  gl_PointSize=min(aPar.z*uScale*(1.+.35*uWild)*(.55+1.6*u)*uPx/max(-mv.z,.3), 260.);
  vA=aAl*(1.+.7*uWild)*A*smoothstep(0.,.07,u)*pow(1.-u,1.25)*step(-.9,p.y); vY=p.y;
  gl_Position=projectionMatrix*mv;
}`;
const SPRAY_FS = `
precision highp float; varying float vA; varying float vY; uniform vec3 uSun; uniform float uSpray;
void main(){ vec2 q=gl_PointCoord*2.-1.; float r=dot(q,q); if(r>1.) discard;
  float a=vA*uSpray*pow(1.-r,1.6);
  float shade=.80+.20*clamp(-q.y*.8+.4,0.,1.);
  gl_FragColor=vec4(vec3(.97,.985,1.)*shade, a); }`;

function buildSpray(w){
  const m=w.m, P=[], Vv=[], Par=[], Al=[];
  let seed=12345; const rnd=()=>{ seed=(seed*1664525+1013904223)>>>0; return seed/4294967296; };
  const xf=D=>m.xtd+m.cinf*D+(m.utip-m.cinf)*0.7*(1-Math.exp(-D/0.7));
  const hb=D=>m.Hb*(0.50*Math.exp(-D/2.4)*(1-Math.exp(-D/0.12))+0.42*(D/0.32)*Math.exp(1-D/0.32));
  const cf=D=>m.cinf+(m.utip-m.cinf)*Math.exp(-D/0.7);
  const push=(x,y,tr,vx,vy,vz,life,size,drag,al)=>{ P.push(x,y,tr); Vv.push(vx,vy,vz); Par.push(life,rnd(),size,drag); Al.push(al); };
  // impact: the lip punches in and water is thrown up and forward
  for(let i=0;i<2600;i++){ const D=Math.pow(rnd(),1.7)*1.5; const h=hb(D);
    push(xf(D)-rnd()*0.8*h, m.ytr+rnd()*0.7*h, D, cf(D)*(0.55+0.6*rnd())+1.5, (1.5+6.5*rnd())*Math.sqrt(m.Hb/3.5)*(1-0.4*D), (rnd()-.5)*2.5, 0.7+1.1*rnd(), 0.5+1.3*rnd(), 1.3, 0.34); }
  // mist hanging over the whitewater
  for(let i=0;i<1700;i++){ const D=0.15+Math.pow(rnd(),1.3)*3.6; const h=hb(D);
    push(xf(D)-rnd()*(1.5+3.5*h), m.ytr+h*(0.3+0.8*rnd()), D, cf(D)*0.45-1.0, 0.4+1.8*rnd(), (rnd()-.5)*1.5, 1.6+1.8*rnd(), 1.6+2.4*rnd(), 2.6, 0.13); }
  // droplets tearing off the falling lip
  const np=m.npre; const rowAt=tr=>{ let r=np-1; while(r>0 && m.tau[r]-m.tb>tr) r--; return r; };
  for(let i=0;i<1400;i++){ const tr=-0.55*Math.pow(rnd(),1.4); const r=rowAt(tr);
    push(m.tipx[r]-rnd()*0.5, m.tipy[r]+rnd()*0.5, tr, m.tipu[r]*(0.9+0.2*rnd()), m.tipv[r]+(rnd()-.3)*1.5, (rnd()-.5)*1.2, 0.35+0.5*rnd(), 0.07+0.13*rnd(), 0.6, 0.55); }
  // plume blown back off the crest by offshore wind
  for(let i=0;i<1500;i++){ const tr=-1.5+2.3*rnd(); const D=Math.max(tr,0); const r=tr<0?rowAt(tr):np-1;
    const x=tr<0?m.crx[r]:m.crx[np-1]+m.cw*D, y=(tr<0?m.cry[r]:m.cry[np-1]*Math.exp(-D/2));
    push(x+(rnd()-.3)*1.2, y-0.1+rnd()*0.3, tr, m.cw*0.35-3.5*rnd(), 1.0+2.6*rnd(), (rnd()-.5)*1.5, 1.2+1.6*rnd(), 0.9+1.8*rnd(), 1.8, 0.11*(tr<0?(0.35+0.65*Math.min(1,(tr+1.5)/1.0)):1)); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('aP0',new THREE.Float32BufferAttribute(P,3)); g.setAttribute('aV0',new THREE.Float32BufferAttribute(Vv,3));
  g.setAttribute('aPar',new THREE.Float32BufferAttribute(Par,4)); g.setAttribute('aAl',new THREE.Float32BufferAttribute(Al,1));
  g.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(Al.length*3),3));
  return g;
}

function setWave(name){
  if(waveMesh){ scene.remove(waveMesh); waveMesh.material.dispose(); scene.remove(sprayPts); sprayPts.material.dispose(); sprayPts.geometry.dispose(); geoHi.dispose(); }
  W=decode(window.WAVE_DATA[name]);
  const m=W.m;
  geoHi=buildWave(W);
  uni.uSun.value.set(m.sun[0],m.sun[1],-m.sun[2]).normalize();
  uni.uXtd.value=m.xtd; uni.uYtr.value=m.ytr; uni.uCw.value=m.cw;
  waveMesh=new THREE.Mesh(geoHi, new THREE.ShaderMaterial({vertexShader:WATER_VS, fragmentShader:WATER_FS, side:THREE.DoubleSide, uniforms:uni}));
  waveMesh.frustumCulled=false; scene.add(waveMesh);
  sprayPts=new THREE.Points(buildSpray(W), new THREE.ShaderMaterial({vertexShader:SPRAY_VS, fragmentShader:SPRAY_FS, transparent:true, depthWrite:false, uniforms:uni}));
  sprayPts.frustumCulled=false; sprayPts.renderOrder=5; scene.add(sprayPts);
  $('ttl').textContent = name==='teahupoo' ? "Teahupo'o-style reef" : "Cloudbreak-style reef";
  refreshLabels(); goCam(curCam, true);
}

/* ---------- camera ---------- */
let zoff=0, zoffTo=0;
const cam={tx:0,ty:0,tz:0, az:0, el:0.2, d:30, fov:42};
const camTo=Object.assign({},cam); let curCam='channel', camBlend=1;
function preset(name){
  const m=W.m, S=uni.uScale.value, V=uni.uV.value;
  const bx=m.xtd*S, by=m.ytr*S, H=m.Hb*S;
  // az: 0 looks toward -x (out to sea) from the shore side; positive az swings the camera toward the shoulder (-z)
  if(name==='channel') return {tx:bx-0.55*H, ty:by+0.38*H, tz:-0.6*H, az:1.30, el:0.07, d:3.6*H+3.2*S, fov:40};
  if(name==='beach')   return {tx:bx-1.0*H,  ty:by+0.45*H, tz:-2.0*H, az:0.10, el:0.045, d:24*H+24*S, fov:13};
  if(name==='aerial')  return {tx:bx-0.5*H,  ty:by,        tz:-2.5*H, az:0.62, el:0.80, d:12*H+11*S, fov:40};
  if(name==='tube')    return {tx:bx-0.70*H, ty:by+0.30*H, tz:-V*0.55*S, az:-1.50, el:0.0, d:V*0.47*S, fov:66};
  if(name==='line')    return {tx:bx-0.6*H,  ty:by+0.5*H,  tz:-6*H, az:-2.0, el:0.16, d:9*H+8*S, fov:40};
}
function goCam(name, snap){
  curCam=name; Object.assign(camTo, preset(name));
  const asp=window.innerWidth/window.innerHeight; if(asp<1 && name!=='tube'){ camTo.d*=Math.min(1.5, 0.75+0.22/asp); } if(snap){ Object.assign(cam,camTo); }
  document.querySelectorAll('#cams button').forEach(b=>b.classList.toggle('on', b.dataset.c===name));
}
function applyCam(dt){
  const k=1-Math.exp(-dt*3.2);
  for(const key in cam){ let dv=camTo[key]-cam[key]; if(key==='az'){ dv=Math.atan2(Math.sin(dv),Math.cos(dv)); } cam[key]+=dv*k; }
  const ce=Math.cos(cam.el), se=Math.sin(cam.el), tz=cam.tz+zoff;
  camera.position.set(cam.tx+cam.d*ce*Math.cos(cam.az), Math.max(cam.ty+cam.d*se, (W?W.m.ytr*uni.uScale.value:0)+0.3), tz-cam.d*ce*Math.sin(cam.az));
  camera.lookAt(cam.tx,cam.ty,tz);
  if(Math.abs(camera.fov-cam.fov)>0.01){ camera.fov=cam.fov; camera.updateProjectionMatrix(); }
}
// touch / mouse orbit
(function(){
  const pts=new Map(); let lastD=0, lastMid=null;
  const free=()=>{ document.querySelectorAll('#cams button').forEach(b=>b.classList.remove('on')); };
  canvas.addEventListener('pointerdown',e=>{ canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button}); lastD=0; lastMid=null; });
  canvas.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId); if(!p) return; const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(pts.size===1){
      if(p.b===2||e.shiftKey){ pan(dx,dy); } else { camTo.az-=dx*0.0055; camTo.el=Math.min(1.5,Math.max(-0.05,camTo.el+dy*0.0045)); cam.az=camTo.az; cam.el=camTo.el; }
      free();
    } else if(pts.size===2){
      const a=[...pts.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); const mid={x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};
      if(lastD){ camTo.d=Math.min(900,Math.max(1.2,camTo.d*lastD/d)); cam.d=camTo.d; }
      if(lastMid){ pan((mid.x-lastMid.x), (mid.y-lastMid.y)); }
      lastD=d; lastMid=mid; free();
    }
  });
  const up=e=>{ pts.delete(e.pointerId); lastD=0; lastMid=null; };
  canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); camTo.d=Math.min(900,Math.max(1.2,camTo.d*Math.exp(e.deltaY*0.0012))); free(); },{passive:false});
  function pan(dx,dy){
    const s=cam.d*Math.tan(cam.fov*Math.PI/360)*2/window.innerHeight;
    const right=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,0), upv=new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld,1);
    camTo.tx+=(-dx*right.x+dy*upv.x)*s; camTo.ty+=(-dx*right.y+dy*upv.y)*s; camTo.tz+=(-dx*right.z+dy*upv.z)*s;
    cam.tx=camTo.tx; cam.ty=camTo.ty; cam.tz=camTo.tz;
  }
})();

/* ---------- UI ---------- */
let speed=1, fixed=false, simT=0, tc=-2.5, secOn=false;
const rideBase=()=>10/Math.sqrt(uni.uScale.value);
function refreshLabels(){
  if(!W) return; const m=W.m, S=uni.uScale.value;
  $('vSize').textContent=(m.Hb*S).toFixed(1)+' m';
  $('vPeel').textContent=(uni.uV.value*Math.sqrt(S)).toFixed(1)+' m/s';

  const ang=Math.asin(Math.min(1,m.cw/uni.uV.value))*180/Math.PI;

  $('st2').textContent='Ride 10 s  ·  '+(uni.uV.value*rideBase()*S).toFixed(0)+' m of reef  ·  meets it at '+ang.toFixed(0)+'°';

}
$('gear').onclick=()=>{ $('panel').classList.toggle('open'); $('gear').classList.toggle('on'); };
document.querySelectorAll('#cams button').forEach(b=>b.onclick=()=>goCam(b.dataset.c,false));
$('rSize').oninput=e=>{ const old=uni.uScale.value, nv=+e.target.value; uni.uScale.value=nv; const k=nv/old;
  for(const o of [cam,camTo]){ o.tx*=k; o.ty*=k; o.tz*=k; o.d*=k; } refreshLabels(); };
$('rPeel').oninput=e=>{ uni.uV.value=+e.target.value; refreshLabels(); if(curCam==='tube'&&document.querySelector('#cams .on')) goCam('tube',false); };
$('rSpd').oninput=e=>{ speed=+e.target.value; refreshLabels(); };
$('bFollow').onclick=()=>{ fixed=false; $('bFollow').classList.add('on'); $('bFixed').classList.remove('on'); };
$('bReplay').onclick=()=>{ tc=-1.5; };
$('bFixed').onclick=()=>{ fixed=true; $('bFixed').classList.add('on'); $('bFollow').classList.remove('on'); };
$('bSec').onclick=()=>{ secOn=!secOn; $('bSec').classList.toggle('on',secOn); $('sec').classList.toggle('open',secOn); sizeSec(); };
$('bSpray').onclick=()=>{ const on=uni.uSpray.value<0.5; uni.uSpray.value=on?1:0; $('bSpray').classList.toggle('on',on); };
document.querySelectorAll('#segBreak button').forEach(b=>b.onclick=()=>{
  const name=b.dataset.b; const act=()=>{ document.querySelectorAll('#segBreak button').forEach(x=>x.classList.toggle('on',x===b)); setWave(name); };

  s.onload=()=>{ b.textContent='Cloudbreak'; act(); }; s.onerror=()=>{ b.textContent='Unavailable'; }; document.head.appendChild(s);

/* ---------- cross-section inset: the solver's own 2D output ---------- */
const sec=$('sec'), sctx=sec.getContext('2d');
function sizeSec(){ const r=sec.getBoundingClientRect(); sec.width=Math.round(r.width*DPR); sec.height=Math.round(r.height*DPR); }
function drawSec(){
  const m=W.m, w=sec.width, h=sec.height; sctx.clearRect(0,0,w,h);
  const t=Math.min(m.tau[m.R-1]-1e-3, Math.max(m.tau[0], m.tb+tc-rideBase()*0.5)); let r=0; while(r<m.R-2 && m.tau[r+1]<t) r++;
  const f=Math.min(1,Math.max(0,(t-m.tau[r])/(m.tau[r+1]-m.tau[r])));
  const x0=m.xtd-34, x1=m.xtd+16, sc=w/(x1-x0), y0=h*0.60;
  const X=x=>(x-x0)*sc, Y=y=>y0-y*sc;
  sctx.lineWidth=1*DPR; sctx.strokeStyle='rgba(234,244,246,.25)'; sctx.beginPath(); sctx.moveTo(0,Y(0)); sctx.lineTo(w,Y(0)); sctx.stroke();
  sctx.fillStyle='rgba(190,170,120,.55)'; sctx.beginPath(); sctx.moveTo(0,h);
  for(let i=0;i<m.bx.length;i++) sctx.lineTo(X(m.bx[i]),Y(m.by[i])); sctx.lineTo(w,h); sctx.fill();
  sctx.strokeStyle='#7fe3d0'; sctx.lineWidth=1.6*DPR; sctx.lineJoin='round'; sctx.beginPath();
  for(let c=0;c<m.M;c++){ const a=r*m.M+c, b=a+m.M; const x=W.PX[a]*(1-f)+W.PX[b]*f, y=W.PY[a]*(1-f)+W.PY[b]*f; if(c) sctx.lineTo(X(x),Y(y)); else sctx.moveTo(X(x),Y(y)); }
  sctx.stroke();
  sctx.fillStyle='rgba(234,244,246,.62)'; sctx.font=(10.5*DPR)+'px ui-sans-serif,system-ui,sans-serif';
  sctx.fillText(t<m.tb?'solver output':'modelled whitewater', 8*DPR, 14*DPR);
}

/* ---------- loop ---------- */
function resize(){ const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(secOn) sizeSec(); }
window.addEventListener('resize',resize);
let last=performance.now(), pr=DPR, slow=0, fast=0;
function frame(now){
  const raw=now-last; const dt=Math.min(0.05,raw/1000); last=now;
  if(raw>30) slow++; else slow=Math.max(0,slow-1); if(raw<19) fast++; else fast=0;
  if(slow>25 && pr>0.6){ pr=Math.max(0.6,pr*0.82); renderer.setPixelRatio(pr); resize(); slow=0; }
  const S=uni.uScale.value, V=uni.uV.value, m=W.m;
  simT+=dt*speed/Math.sqrt(S);
  uni.uTime.value=simT;
  tc+=dt*speed/Math.sqrt(S);
  const ride=rideBase(), c0=-9, c1=ride+5.2;
  if(tc>c1) tc=c0;
  uni.uPeel.value=-V*tc; uni.uZend.value=-V*ride;
  const s01=x=>{ x=Math.min(1,Math.max(0,x)); return x*x*(3-2*x); };
  uni.uFake.value=s01((tc-c0)/2.5)*(1-s01((tc-(c1-2.5))/2.5));
  zoffTo=(fixed? -V*ride*0.5 : Math.min(0,Math.max(-V*ride, -V*tc)))*S;
  zoff+=(zoffTo-zoff)*(1-Math.exp(-dt*(Math.abs(zoffTo-zoff)>40*S?3:30)));
  applyCam(dt);
  uni.uPx.value=window.innerHeight*pr/(2*Math.tan(camera.fov*Math.PI/360));
  sky.position.copy(camera.position);
  renderer.render(scene,camera);
  if(secOn) drawSec();
  requestAnimationFrame(frame);
}
resize(); setWave('teahupoo'); refreshLabels();
window.__wave={cam,camTo,uni,goCam,set:(o)=>{ if(o.t!==undefined) tc=o.t; if(o.speed!==undefined) speed=o.speed; }};
requestAnimationFrame(t=>{ last=t; frame(t); $('load').classList.add('done'); });
})();
</script>
